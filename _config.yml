# =============================================================================
# PNU IBA 홈페이지 설정
# 이 파일을 고친 뒤에는 로컬 서버(jekyll serve)를 껐다 켜야 반영됩니다.
# =============================================================================

# -----------------------------------------------------------------------------
# 사이트 기본 정보
# -----------------------------------------------------------------------------

title: IBA
last_name: IBA # 하단 저작권 문구(© Copyright 연도 IBA.)와 페이지 작성자 정보에 쓰임
brand_subtitle: Intelligent Business Analytics # 왼쪽 위 IBA 아래 작은 글씨
contact_note: >
  프로젝트 제안 및 문의는 메일 또는 인스타그램 DM으로 연락 주세요.
description: >
  부산대학교 지능형 경영 데이터 분석 학회 IBA(Intelligent Business Analytics)
footer_text: >
  Hosted by GitHub Pages.
keywords: 부산대학교, 부산대, IBA, 경영 데이터 분석, 학회, 동아리, 데이터 분석, 머신러닝
lang: ko
icon: logo/favicon.png # 브라우저 탭 아이콘 (assets/img/ 기준 경로)
apple_touch_icon: /assets/img/logo/favicon.png # 아이폰 홈 화면 아이콘 (사이트 루트 기준 경로)

url: https://pnuiba.github.io # 배포 주소 (GitHub Pages). 개인 도메인을 연결하면 여기를 바꿔 주세요
baseurl: "" # 루트 도메인에 배포하므로 비워 둡니다
last_updated: false
impressum_path:
back_to_top: true

protect_email: false

# -----------------------------------------------------------------------------
# al-folio API (v1.x)
# -----------------------------------------------------------------------------

al_folio:
  api_version: 1
  style_engine: tailwind
  tailwind:
    version: 4.1.18
    preflight: false
    css_entry: assets/tailwind/app.css
  distill: # 쓰지 않지만 al_folio_core가 값을 요구합니다
    engine: distillpub-template
    source: al-org-dev/distill-template#al-folio
    allow_remote_loader: false
  features:
    cv:
      enabled: false
    distill:
      enabled: false
  compat:
    bootstrap:
      enabled: false
  upgrade:
    channel: stable
    auto_apply_safe_fixes: false

# -----------------------------------------------------------------------------
# Layout
# -----------------------------------------------------------------------------

navbar_fixed: true
footer_fixed: true
search_enabled: true # 상단 검색 (단축키 Ctrl+K / ⌘K)
socials_in_search: true
posts_in_search: true
bib_search: false

max_width: 930px

# -----------------------------------------------------------------------------
# 검색엔진 / 링크 미리보기
# -----------------------------------------------------------------------------

serve_og_meta: true
serve_schema_org: false
og_image: /assets/img/logo/logo-dark.png # 카카오톡 등 링크 미리보기 이미지

# -----------------------------------------------------------------------------
# 방문자 통계 (선택) — Cloudflare Web Analytics 토큰을 넣으면 켜집니다
# -----------------------------------------------------------------------------

analytics:
  cloudflare:
enable_simple_analytics: false

google_site_verification:
bing_site_verification:

# -----------------------------------------------------------------------------
# 소식(news)
# -----------------------------------------------------------------------------

permalink: /blog/:year/:title/
lsi: false

pagination:
  enabled: false

related_blog_posts:
  enabled: false

newsletter:
  enabled: false

# -----------------------------------------------------------------------------
# Collections
#   news       → _news/       공지·소식
#   projects   → _projects/   교류 활동(행사 사진 카드). 이름은 al-folio 기본값을 그대로 씁니다.
# -----------------------------------------------------------------------------

collections:
  news:
    defaults:
      layout: post
    output: true
  projects:
    output: true

defaults:
  - scope:
      path: "assets"
    values:
      sitemap: false
  - scope:
      path: ""
      type: projects
    values:
      layout: page

# -----------------------------------------------------------------------------
# Jekyll settings
# -----------------------------------------------------------------------------

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: "highlight"
    span:
      line_numbers: false
    block:
      line_numbers: false
      start_line: 1

include: ["_pages"]
exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - CONTRIBUTING.md
  - AGENTS.md
  - CLAUDE.md
  - al-folio-upgrade-report.md
  - vendor
  - node_modules
keep_files:
  - CNAME
  - .nojekyll

theme: al_folio_core

# 플러그인 목록 — Gemfile과 반드시 일치해야 합니다
plugins:
  - jekyll-3rd-party-libraries
  - jekyll-cache-bust
  - jekyll-email-protect
  - jekyll-feed
  - jekyll-link-attributes
  - jekyll-minifier
  - jekyll-paginate-v2
  - jekyll-regex-replace
  - jekyll/scholar # 논문 기능은 쓰지 않지만 al_folio_core 레이아웃이 태그를 참조해서 필요합니다
  - jekyll-sitemap
  - jekyll-socials
  - jekyll-tabs
  - jekyll-toc
  - jemoji

  # al-folio plugins
  - al_folio_core
  - al_icons
  - al_folio_upgrade
  - al_analytics
  - al_img_tools
  - al_search
  - al_charts
  - al_email_protect

sass:
  style: compressed

jekyll-minifier:
  compress_javascript: false
  # Tailwind CSS는 이미 압축되어 있고, 다시 압축하면 레이아웃이 깨집니다.
  compress_css: false
  exclude: ["robots.txt"]

# -----------------------------------------------------------------------------
# 링크 / 이미지
# -----------------------------------------------------------------------------

external_links:
  enabled: true
  rel: external nofollow noopener
  target: _blank
  exclude:

# ImageMagick이 없어도 빌드되도록 꺼 둡니다 (GitHub Actions 빌드 환경 단순화)
imagemagick:
  enabled: false

lazy_loading_images: true

# -----------------------------------------------------------------------------
# 선택 기능
# -----------------------------------------------------------------------------

enable_google_verification: false
enable_bing_verification: false
enable_cookie_consent: false
enable_masonry: true # 활동 카드 자동 배치
enable_math: false
enable_tooltips: false
enable_darkmode: true # 라이트/다크 모드 전환 버튼
enable_navbar_social: false
enable_project_categories: true # 활동 카드를 카테고리별로 묶기
enable_medium_zoom: true # 이미지 클릭 시 확대
enable_progressbar: true # 상단 스크롤 진행 바
enable_video_embedding: false

