# 자주 묻는 질문 (IBApply 페이지 /ibapply/ 의 FAQ). 위에서부터 순서대로 표시됩니다.
# q(질문), a(답변)를 추가하세요. 답변은 한두 문장으로 짧게.
- q: "휴학 중이어도 활동할 수 있나요?"
  a: "네, 휴학 여부와 관계없이 활동할 수 있습니다."
- q: "졸업 유예생도 지원할 수 있나요?"
  a: "네, 2학기 이상 활동할 수 있다면 지원 가능합니다."
- q: "모집 시기와 인원은 어떻게 되나요?"
  a: "학기당 한 번, 매년 1월 초·7월 초에 정규 모집합니다. 기수당 약 15명을 선발하며, 추가 모집은 없습니다."
- q: "경쟁률은 어느 정도인가요?"
  a: "평균 약 2.5:1입니다."
- q: "면접은 어떻게 진행되나요?"
  a: "면접은 지원서를 바탕으로 진행하며, 구체적인 문항은 비공개입니다."
- q: "지원서 분석 주제는 경영·금융과 관련되어야 하나요?"
  a: "아닙니다. 관심 있는 데이터 분석 주제를 자유롭게 작성하면 됩니다."
- q: "학점도 평가에 포함되나요?"
  a: "아닙니다. 학점은 기재하지 않아도 됩니다."
- q: "코딩 경험이 없어도 지원할 수 있나요?"
  a: "코딩 경험과 관계없이 지원할 수 있습니다."
- q: "교육 세션은 어떻게 진행되나요?"
  a: "보통 2~3시간(짧게는 1시간) 진행되며, 기존 기수가 강의하고 실습은 팀 프로젝트로 진행합니다."
- q: "정기 세션 참석이 어려우면 어떻게 하나요?"
  a: "정기 세션 참석이 어렵다면 면접 시 가능한 활동 일정과 불참 사유를 알려 주세요."
- q: "신입 부원도 교육 발표를 하나요?"
  a: "네. 첫 학기에 교육을 받고, 다음 학기에 새 기수에게 교육을 진행하는 것이 필수 과정입니다."
