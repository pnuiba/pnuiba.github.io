      partner: "웨이브앤바이브"
      comment: "브랜드 경험 중심 인터랙티브 웹사이트 기획 및 구현. 8주간 웨이브앤바이브와 협력하며 매주 실무 피드백을 받아 기존 웹사이트의 UI/UX 한계를 진단하고 브랜딩 방향과 UX 흐름을 정립했습니다. 브랜드 가치를 전달하는 ‘국밥 만들기 게임’과 고객 취향 데이터를 수집하는 ‘나만의 퍼스널 국밥 찾기’를 기획했습니다. Cursor로 웹페이지를 구현하고 Supabase 데이터베이스를 연동해 Vercel에 배포했으며, 식당 테이블에 QR 코드를 배치해 오프라인 고객의 홈페이지 유입을 늘리는 전략을 수립했습니다."
