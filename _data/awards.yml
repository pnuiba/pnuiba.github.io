# 수상 내역 (/awards/ 페이지)
#
# 연도(term)별로 묶습니다. 페이지 위 탭에서 연도를 고르면 그 해의 수상만 보입니다.
#   - 연도마다 "YYYY" 칸 하나입니다. 수상일(date) 기준으로 넣어 주세요.
#     (items: [] 를 items: 로 바꾸고 그 아래에 - title: ... 줄을 붙여 넣으면 됩니다)
#   - 수상이 없는 연도는 페이지에 표시되지 않습니다.
#   - 최신 연도를 맨 위에, 칸 안에서는 최신 수상을 위에 둡니다. 수상이 있는 연도 중 맨 위가 처음 열릴 때 기본으로 보입니다.
#
# 수상마다 왼쪽에 사진 칸, 오른쪽에 Comment 칸이 항상 표시됩니다. title 만 필수이고 나머지는 채운 것만 보입니다.
#
#   예)  term: "2026"
#        items:
#          - title: "제 4회 전국 대학(원)생 리스크관리 경진대회"
#            grade: ["장려상"]                          # 수상 등급 라벨 (여러 개면 쉼표로)
#            date: 2026-05-28                          # 수상일 (모르면 생략. 사진·Summary·발표자료가 없는 수상은 연도 맨 아래 목록으로 간단히 표시)
#            id: 2026-risk-smart-shield                # date 와 id 가 모두 있으면 홈 NEWS! 에 최신순 5개까지 자동으로 표시
#            members: ["홍길동(11기)", "김철수(12기)"]     # 수상자 (제목 바로 아래 한 줄)
#            teams:                                    # 한 대회에서 등급별로 수상자가 다르면 members 대신 이렇게
#              - grade: 대상                            #   → 제목 아래 "[대상] 8기 OOO · 9기 OOO" 한 줄씩
#                members: ["OOO(8기)", "OOO(9기)"]
#              - grade: 우수상
#                members: ["OOO(9기)", "OOO(10기)"]
#            image: assets/img/awards/2026-risk/01.jpg    # 사진 한 장 (가로 16:9 권장, 발표자료 표지 비율)
#            images:                                   # 사진 여러 장이면 image 대신 이렇게. 첫 장이 대표 사진
#              - assets/img/awards/2026-risk/01.jpg
#              - assets/img/awards/2026-risk/02.jpg
#            organizer: "주최 기관명"
#            comment: "어떤 문제를 어떻게 풀었는지 1~3문장"   # 페이지에는 Summary 로 표시
#            slides: assets/pdf/awards/2026-risk.pdf   # 발표자료 (PDF 권장, 구글 슬라이드 등 링크 URL도 가능)

