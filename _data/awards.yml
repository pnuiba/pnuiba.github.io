      partner: "후아"
      comment: "세일링 요트의 부유물 충돌 사고 예방을 위한 AI 기반 해양 부유물 인식 시스템. 8주간 후아와 협력하며 매주 실무 피드백을 받아 요트 콕핏 시점 이미지 약 200장을 수집했습니다. 시간대 변환, 환경 효과, 노이즈 추가 등 11가지 데이터 증강 시나리오를 적용해 학습 데이터 8,149장을 구축하고 10개 클래스로 라벨링했습니다. YOLOv8s 전이학습으로 mAP@50 약 72.9%를 달성해 실시간 부유물 탐지 시스템의 기술적 가능성을 검증했습니다."
