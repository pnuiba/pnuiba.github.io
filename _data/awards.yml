    - title: "제4회 전국 대학(원)생 리스크 관리 경진대회"
      id: 2026-risk-smart-shield
      grade: ["장려상"]
      date: 2026-05-28
      members: ["신동욱(8기)", "한고은(9기)", "전형준(10기)"]
      members_note: "외 1인"
      organizer: "삼성화재 × POSTECH × 서울대학교"
      comment: "스마트팜 맞춤형 보험 설계: Smart Shield. 스마트팜의 복합 리스크(물리적·생육·운영중단·디지털 손해)에 대응하는 AI 기반 파라메트릭 보험을 제안했습니다. 농촌진흥청의 4년치 환경 데이터(1,247만 행)와 농업정책보험금융원의 23년 통계를 바탕으로 5개 작물의 보험료율(4~7%)을 산출하고, LightGBM으로 7일 후 작물 스트레스를 예측해 농가에 사전 경보를 제공합니다. 보험계리(Engine A)와 AI 사전 경보(Engine B)를 분리해 AI 예측 정확도가 보험금 지급 정합성에 영향을 주지 않도록 설계했습니다."
      slides: assets/pdf/awards/2026-risk-smart-shield.pdf
      images:
        - assets/img/awards/2026-risk-smart-shield/01.png
        - assets/img/awards/2026-risk-smart-shield/02.png

