    - title: "데이터로 상상하는 K-Culture 굿즈 아이디어톤"
      id: 2025-k-culture-nfc-keyring
      grade: ["대상"]
      date: 2025-11-27
      members: ["황현석(10기)"]
      members_note: "외 3인"
      comment: "부산대학교 학생 생활 편의 향상을 위한 사용자 맞춤형 NFC 키링 기획 및 수요 예측 프로젝트. 통계연보의 재학생 데이터를 코호트 분석과 선형 회귀로 분석해 2026년 예상 재학생 규모를 약 19,668명으로 추산했습니다. 에브리타임 학생증 관련 게시글 3,600건을 SBERT와 kiwi로 분석해 분실 위험과 휴대성 저하를 확인하고 NFC 키링의 필요성을 검증했습니다. 13개 대학의 굿즈 사례와 설문 결과에 대한 컨조인트 분석을 통해 금정산 능선을 형상화한 정사면체 디자인과 다기능 NFC 구성을 도출하고, 캠퍼스 내 활용 지점을 조사해 인프라 호환성을 확인했습니다. 구매 점수와 실현율로 판매량 및 수익성을 예측해 시장 출시 가능성과 학생 생활 편의 증진 효과를 제시했습니다."
      images:
        - assets/img/awards/2025-k-culture-nfc-keyring/01.png
        - assets/img/awards/2025-k-culture-nfc-keyring/02.png

