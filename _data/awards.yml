# 수상 내역 (/awards/ 페이지)
#
# 기간(term)별로 묶습니다. 페이지 위 선택 상자에서 기간을 고르면 그 기간의 수상만 보입니다.
#   - 연도마다 "YYYY-2"(2학기), "YYYY-1"(1학기) 칸이 미리 만들어져 있습니다.
#   - 아래 "학기 미정" 묶음에 있는 수상을 알맞은 학기 칸의 items 로 옮겨 주세요.
#     (items: [] 를 items: 로 바꾸고 그 아래에 - title: ... 줄을 붙여 넣으면 됩니다)
#   - 모두 옮긴 "학기 미정" 묶음은 지워도 됩니다. 수상이 없는 칸은 페이지에 표시되지 않습니다.
#   - 최신 기간을 맨 위에 둡니다. 수상이 있는 기간 중 맨 위가 처음 열릴 때 기본으로 보입니다.
#
# 수상마다 왼쪽에 사진 칸, 오른쪽에 Comment 칸이 항상 표시됩니다. title 만 필수이고 나머지는 채운 것만 보입니다.
#
#   예)  term: "2026-1"
#        items:
#          - title: "제 4회 전국 대학(원)생 리스크관리 경진대회"
#            grade: ["장려상"]                          # 수상 등급 라벨 (여러 개면 쉼표로)
#            date: 2026-05-28                          # 수상일 ("# 임시 날짜" 표시가 있는 값은 실제 날짜로 바꿔 주세요)
#            members: ["11기 홍길동", "12기 김철수"]     # 수상자 (제목 바로 아래 한 줄)
#            teams:                                    # 한 대회에서 등급별로 수상자가 다르면 members 대신 이렇게
#              - grade: 대상                            #   → 제목 아래 "[대상] 8기 OOO · 9기 OOO" 한 줄씩
#                members: ["8기 OOO", "9기 OOO"]
#              - grade: 우수상
#                members: ["9기 OOO", "10기 OOO"]
#            image: assets/img/awards/2026-risk.jpg    # 사진 한 장 (가로 4:3 권장)
#            images:                                   # 사진 여러 장이면 image 대신 이렇게. 첫 장이 대표 사진
#              - assets/img/awards/2026-risk-1.jpg
#              - assets/img/awards/2026-risk-2.jpg
#            comment: "어떤 문제를 어떻게 풀었는지 1~3문장"   # 페이지에는 Summary 로 표시
#            slides: assets/pdf/awards/2026-risk.pdf   # 발표자료 (PDF 권장, 구글 슬라이드 등 링크 URL도 가능)

