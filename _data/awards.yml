        - assets/img/awards/2026-lh-compas-system-pusan/02.png

    - title: "2026 미래도서관 정책 아이디어 해커톤대회"
      id: 2026-future-library-voucher
      grade: ["최우수상"]
      date: 2026-04-08
      members: ["한고은(9기)", "박태정(10기)"]
      organizer: "문화체육관광부"
      comment: "납본 보상 바우처화를 통한 출판 생태계 순환 설계. 국가문헌 보존과 창작자 보상을 위한 납본 제도에서, 형식만 갖춘 자료도 동일한 현금 보상을 받을 수 있다는 점에 주목했습니다. AI 판별이나 창작성 심사 없이 납본 보상을 현금에서 출판 생태계 전용 바우처로 전환하고, 재화 구매 대신 용역·서비스에만 사용하도록 제안했습니다. 보상 방식의 재설계를 통해 AI 대량출판의 경제적 유인을 조정하고, 납본 보상이 출판 생태계 안에서 순환하는 지속가능한 제도 운영 기반을 마련하고자 했습니다."
      slides: assets/pdf/awards/2026-future-library-voucher.pdf
      images:
        - assets/img/awards/2026-future-library-voucher/01.png
        - assets/img/awards/2026-future-library-voucher/02.png

