      comment: "텍스트 마이닝을 이용한 강건성 지수 평가: 주가 상관관계 분석을 중심으로. 기업의 위기는 내부에서 먼저 감지된다는 가정 아래, DART 재무 변수와 잡플래닛 기업 리뷰를 KoBERT로 감성 분석한 값을 결합해 기업 강건성 지수를 개발했습니다. 리뷰 감성값을 반영하면 위기를 더 정밀하게 예측할 수 있음을 확인했고, 설명 가능한 수학적 지수로 머신러닝의 블랙박스 문제를 해소했습니다."

